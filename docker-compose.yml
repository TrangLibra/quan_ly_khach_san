services:
  # 1. PostgreSQL Database for Medusa v2 (Port đổi sang 5433 để tránh trùng DB khác)
  postgres:
    image: postgres:16-alpine
    container_name: grand_horizon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-medusa_hotel}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Event Bus for Medusa v2
  redis:
    image: redis:7-alpine
    container_name: grand_horizon_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MedusaJS v2 Headless Backend Engine (Port 9000)
  medusa-backend:
    build:
      context: ./medusa-backend
      dockerfile: Dockerfile
    container_name: grand_horizon_medusa
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-supersecretpassword}@postgres:5432/${POSTGRES_DB:-medusa_hotel}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-grand_horizon_secret_key_2026_luxury_hotel}
      COOKIE_SECRET: ${COOKIE_SECRET:-grand_horizon_cookie_secret_2026}
      STORE_CORS: ${STORE_CORS:-http://localhost:8080,http://localhost:5173}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:8080,http://localhost:9000,http://localhost:5173}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:8080,http://localhost:9000,http://localhost:5173}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. React Vite Frontend & Nginx Proxy (ĐỔI SANG PORT 8080 ĐỂ KHÔNG TRÙNG PORT 80 CỦA WORDPRESS/APACHE)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grand_horizon_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - medusa-backend

volumes:
  pgdata:
  redisdata:
